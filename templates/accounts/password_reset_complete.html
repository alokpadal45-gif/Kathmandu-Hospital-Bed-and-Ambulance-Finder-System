{% extends "base.html" %}

{% block title %}Password Reset Complete — Kathmandu Emergency Finder{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <h4 class="mb-3">Password updated</h4>
                <p class="text-muted mb-4">Your password has been changed successfully.</p>
                <a href="{% url 'accounts:login' %}" class="btn btn-danger">Log In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
